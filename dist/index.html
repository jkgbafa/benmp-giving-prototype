<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="Give securely through BENMP as an individual or organization partner."
    />
    <title>BENMP · Healing Jesus Campaign</title>
    <link rel="icon" type="image/png" sizes="512x512" href="assets/benmp-favicon.png" />
    <link rel="stylesheet" href="style.css?v=20260924-smooth-header-fade" />
    <style>
      .method-lines {
        display: grid;
        gap: 0;
        margin-top: 13px;
      }
      .method-line {
        display: grid;
        gap: 3px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
        color: var(--ink);
      }
      .method-line:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .method-line span {
        font-weight: 600;
      }
      .method-line small {
        color: var(--muted);
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to giving</a>
    <div class="product-bar">
      BENMP GIVING
      <span>Secure giving for every partner.</span>
    </div>
    <header>
      <a class="brand" href="#home"
        ><img src="assets/healing-jesus.png" alt="Healing Jesus" /><span
          class="brand-copy"
          ><strong>BENMP</strong><small>Healing Jesus Campaign</small></span
        ></a
      >
      <nav aria-label="Main navigation">
        <a href="#home" class="active">Home</a
        ><a href="#about">About</a
        ><a href="#contact">Contact us</a
        ><a href="#give" class="nav-give">Donate</a
        ><a href="#dashboard" data-auth-only hidden>My giving</a
        ><a href="#messages" data-auth-only hidden
          >Messages <span id="unread"></span
        ></a>
      </nav>
      <div class="header-actions">
        <button id="appearance" class="icon-btn" aria-label="Change appearance">
          ◐</button
        ><button id="signin" class="quiet">Sign in</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer>
      <span>BENMP <span class="muted">· Every partner matters.</span></span>
      <div>
        <button data-action="help">Help</button
        ><button data-action="privacy">Privacy</button
        ><button data-action="reset">Reset</button>
      </div>
    </footer>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="app.js?v=20260924-email-match"></script>
  </body>
</html>
